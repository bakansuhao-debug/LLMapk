name: Build APK from zip
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - run: unzip -q LocalLLM-android.zip
      - run: sed -i 's/GIT_TAG b5000/GIT_TAG b5001/' LocalLLM/app/src/main/cpp/CMakeLists.txt
      - run: echo "android.suppressUnsupportedCompileSdk=35" >> LocalLLM/gradle.properties
      - run: sed -i '/GGML_CPU_ARM_ARCH/d' LocalLLM/app/src/main/cpp/CMakeLists.txt
      - run: gradle assembleRelease --no-daemon
        working-directory: LocalLLM
      - uses: actions/upload-artifact@v4
        with:
          name: local-llm-apk
          path: LocalLLM/app/build/outputs/apk/release/*.apk
